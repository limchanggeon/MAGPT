[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mepiti"
version = "0.3.8"
description = "메피티 — 로컬 근거 기반 메이플 어시스턴트"
requires-python = ">=3.9"
dependencies = ["keyring>=25,<26", "Pillow>=11,<12", "psutil>=7,<8", "anthropic>=1.9,<2"]

[project.optional-dependencies]
desktop = ["pywebview>=5,<6"]
build = ["pyinstaller>=6,<7", "pywebview>=5,<6"]

[project.scripts]
mepiti = "mepiti.server:main"

[tool.setuptools.packages.find]
include = ["mepiti*"]

[tool.setuptools.package-data]
mepiti = ["static/*"]
