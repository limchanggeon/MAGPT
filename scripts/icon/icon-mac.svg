<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS 앱 아이콘: 1024 캔버스에 824 사각형(가장자리 100 여백). 다른 앱과 Dock 크기가 맞는다. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efbe5f"/><stop offset="1" stop-color="#d49a35"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#s)"/>
  <g transform="translate(100 100) scale(12.875)">
    <path d="M17 44V22l15 13 15-13v22" fill="none" stroke="#1a1205" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
