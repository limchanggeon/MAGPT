name: Local app checks and installers
on:
  workflow_dispatch:
  push:
    paths: ['mepiti/**', 'tests/**', 'scripts/**', 'pyproject.toml', '.github/workflows/build.yml']
    branches: ['**']
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - run: node --check mepiti/static/app.js
      - run: node --check mepiti/static/characters.js
      - run: node --check mepiti/static/tour.js
      - run: node tests/test_frontend.js
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mepiti-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*-Setup.exe
            dist/*.dmg
            dist/*-update.zip
  # 'v'로 시작하는 태그를 올리면 두 OS 설치 파일을 Releases 페이지에 올린다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 앱의 자동 업데이트가 받은 파일을 확인하는 데 쓴다(mepiti/updater.py).
      - run: cd dist && sha256sum *-Setup.exe *.dmg *-update.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-Setup.exe
            dist/*.dmg
            dist/*-update.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
